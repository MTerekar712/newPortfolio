<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#003566"/>
      <stop offset="100%" stop-color="#075e6b"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A9396"/>
      <stop offset="50%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#DAC09B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#portBg)"/>

  <!-- Geometric accent circles -->
  <circle cx="100" cy="80" r="120" fill="rgba(10, 147, 150, 0.12)" filter="blur(30px)"/>
  <circle cx="500" cy="280" r="140" fill="rgba(82, 183, 136, 0.12)" filter="blur(35px)"/>

  <!-- Modern Browser / Tablet Mockup -->
  <g transform="translate(70, 35)">
    <!-- Main glass device frame -->
    <rect width="460" height="290" rx="16" fill="rgba(0, 31, 63, 0.8)" stroke="url(#glowBorder)" stroke-width="2"/>

    <!-- Browser top bar -->
    <rect width="460" height="38" rx="16" fill="#00182c"/>
    <rect y="22" width="460" height="16" fill="#00182c"/>
    <circle cx="22" cy="19" r="4.5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="4.5" fill="#f59e0b"/>
    <circle cx="54" cy="19" r="4.5" fill="#10b981"/>

    <!-- Search/URL Bar -->
    <rect x="80" y="8" width="280" height="22" rx="11" fill="rgba(148, 210, 189, 0.12)" stroke="rgba(148, 210, 189, 0.2)"/>
    <text x="220" y="23" fill="#94D2BD" font-family="monospace" font-size="10" text-anchor="middle">https://portfolio-6wxx.vercel.app</text>

    <!-- Hero Content Mockup inside the page -->
    <!-- Mini pill tag -->
    <rect x="35" y="65" width="130" height="20" rx="10" fill="rgba(10, 147, 150, 0.3)" stroke="#0A9396"/>
    <text x="100" y="79" fill="#94D2BD" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SOFTWARE DEVELOPER</text>

    <!-- Heading -->
    <text x="35" y="115" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold">Hi, I'm Mayur Terekar.</text>
    <text x="35" y="138" fill="#52B788" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Building Digital Experiences with Code.</text>

    <!-- Mini CTA Buttons -->
    <rect x="35" y="155" width="95" height="28" rx="6" fill="#0A9396"/>
    <text x="82" y="173" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Explore Work</text>

    <rect x="140" y="155" width="105" height="28" rx="6" fill="rgba(148, 210, 189, 0.1)" stroke="rgba(148, 210, 189, 0.3)"/>
    <text x="192" y="173" fill="#94D2BD" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Download CV</text>

    <!-- Mini Right Side Avatar Card -->
    <g transform="translate(280, 60)">
      <rect width="145" height="150" rx="12" fill="rgba(0, 31, 63, 0.9)" stroke="rgba(82, 183, 136, 0.4)" stroke-width="1.5"/>
      <circle cx="72" cy="65" r="38" fill="#003566" stroke="#0A9396" stroke-width="2"/>
      <text x="72" y="72" fill="#52B788" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">MT</text>
      <text x="72" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mayur Terekar</text>
      <text x="72" y="137" fill="#94D2BD" font-family="sans-serif" font-size="8.5" text-anchor="middle">EXTC - BVCOE Navi Mumbai</text>
    </g>

    <!-- Feature Badges on bottom -->
    <g transform="translate(35, 230)">
      <rect x="0" y="0" width="115" height="36" rx="6" fill="rgba(10, 147, 150, 0.15)" stroke="rgba(10, 147, 150, 0.3)"/>
      <text x="12" y="16" fill="#94D2BD" font-family="sans-serif" font-size="8.5">STACK</text>
      <text x="12" y="28" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="bold">React + GSAP</text>

      <rect x="135" y="0" width="115" height="36" rx="6" fill="rgba(82, 183, 136, 0.15)" stroke="rgba(82, 183, 136, 0.3)"/>
      <text x="147" y="16" fill="#52B788" font-family="sans-serif" font-size="8.5">DESIGN</text>
      <text x="147" y="28" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="bold">Glassmorphism</text>

      <rect x="270" y="0" width="120" height="36" rx="6" fill="rgba(218, 192, 155, 0.15)" stroke="rgba(218, 192, 155, 0.3)"/>
      <text x="282" y="16" fill="#DAC09B" font-family="sans-serif" font-size="8.5">RESPONSIVE</text>
      <text x="282" y="28" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="bold">Mobile &amp; 4K Ready</text>
    </g>
  </g>
</svg>
